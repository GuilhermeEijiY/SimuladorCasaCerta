name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Pull configuração da Vercel
        working-directory: ./Frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build do projeto
        working-directory: ./Frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_API_URL: https://casacerta-api.vercel.app/api/v1

      - name: Deploy na Vercel
        id: deploy
        working-directory: ./Frontend
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT

      - name: Atribuir alias casacerta-cce.vercel.app
        working-directory: ./Frontend
        run: vercel alias ${{ steps.deploy.outputs.url }} casacerta-cce.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
